version: '3'
services:
  api:
    container_name: back_api
    build:
      context: .
    image: back_api_1:latest
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://ooodbuser:password@postgres:5432/ooo_db
    networks:
      - prisma-network
    command: npm run dev
